# Test Environment Configuration
spring.application.name=cricket-app-backend-test

spring.datasource.url=jdbc:h2:mem:cricket_app_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.jwt.secret=TestSuperSecur3JwtSecretKey2026WithEnoughLength!
app.jwt.expiration-ms=3600000

app.otp.expiration-minutes=5
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=0
app.otp.dev-log-enabled=true

app.email.enabled=false
