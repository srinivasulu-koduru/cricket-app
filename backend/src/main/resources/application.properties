# Application Configuration
spring.application.name=cricket-app-backend
server.port=8080

# Database Configuration (MySQL)
# Do NOT hardcode production credentials. Set DB_URL, DB_USERNAME, DB_PASSWORD environment variables in production.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cricket_app?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Pool Configuration
spring.datasource.hikari.initialization-fail-timeout=-1

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5500,http://localhost:5500,http://localhost:3000,http://127.0.0.1:8080,http://localhost:8080}

# JWT Authentication Configuration
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# OTP Configuration
app.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:5}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
app.otp.dev-log-enabled=${OTP_DEV_LOG_ENABLED:false}

# SMTP Real Email Configuration
# Configure MAIL_USERNAME and MAIL_PASSWORD environment variables for real email delivery
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.email.enabled=${APP_EMAIL_ENABLED:true}

