<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Teams - Cricket App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="app-background">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>

    <div class="container">
        <!-- Main Navigation Header -->
        <header class="header">
            <a href="../index.html" class="brand-link">
                <div class="brand-icon">🏏</div>
                <h1 class="brand-title">Cricket <span>App</span></h1>
            </a>

            <nav class="nav-links">
                <a href="dashboard.html" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    Dashboard
                </a>
                <a href="teams.html" class="nav-item active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    My Teams
                </a>
                <a href="profile.html" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    My Profile
                </a>
                <a href="players.html" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    Search Players
                </a>
                <button id="btn-logout" class="btn btn-secondary btn-sm">Sign Out</button>
            </nav>

            <button class="mobile-menu-btn" id="mobile-menu-toggle" aria-label="Toggle Navigation">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
        </header>

        <!-- Mobile Drawer Menu -->
        <div class="mobile-nav-drawer" id="mobile-nav-drawer">
            <div class="mobile-drawer-header">
                <span class="brand-title" style="font-size: 1.2rem;">Cricket <span>App</span></span>
                <button class="mobile-drawer-close" id="mobile-drawer-close">&times;</button>
            </div>
            <a href="dashboard.html" class="nav-item">Dashboard</a>
            <a href="teams.html" class="nav-item active">My Teams</a>
            <a href="profile.html" class="nav-item">My Profile</a>
        </div>

        <!-- Main Body -->
        <main class="main-content" id="teams-main-content">
            <div id="teams-alert" class="alert alert-error" style="display: none;"></div>

            <!-- Page Action Bar -->
            <div class="page-action-bar">
                <div>
                    <h2 class="page-title">My Cricket Teams</h2>
                    <p class="page-subtitle">Manage your created teams and team memberships.</p>
                </div>

                <div class="action-buttons">
                    <button id="btn-open-invitations" class="btn btn-secondary">
                        📩 Pending Invitations
                        <span id="invitation-count-badge" class="badge-count" style="display: none;">0</span>
                    </button>
                    <button id="btn-open-create-modal" class="btn btn-primary">
                        ➕ Create New Team
                    </button>
                </div>
            </div>

            <!-- Teams Grid -->
            <div id="teams-grid" class="teams-grid">
                <!-- Skeleton Shimmer initial state -->
                <div class="team-card skeleton-box" style="height: 200px;"></div>
                <div class="team-card skeleton-box" style="height: 200px;"></div>
            </div>
        </main>

        <footer class="footer">
            <p>Cricket App &copy; 2026 &bull; Stage 4 Team Management Module</p>
        </footer>
    </div>

    <!-- Create Team Modal -->
    <div id="create-team-modal" class="modal-backdrop" style="display: none;">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title">Create Cricket Team</h3>
                <button id="btn-close-create-modal" class="modal-close-btn">&times;</button>
            </div>

            <div id="create-modal-alert" class="alert alert-error" style="display: none;"></div>

            <form id="create-team-form">
                <div class="form-group">
                    <label for="create-team-name">Team Name <span class="required">*</span></label>
                    <input type="text" id="create-team-name" required maxlength="100" class="input-field" placeholder="e.g. Nellore Warriors">
                </div>

                <div class="form-group">
                    <label for="create-team-desc">Team Description / Tagline</label>
                    <textarea id="create-team-desc" rows="3" maxlength="500" class="input-field" placeholder="Briefly describe your cricket team..."></textarea>
                </div>

                <div class="modal-footer">
                    <button type="button" id="btn-cancel-create-modal" class="btn btn-secondary">Cancel</button>
                    <button type="submit" id="btn-submit-create-team" class="btn btn-primary">Create Team</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Pending Invitations Modal -->
    <div id="invitations-modal" class="modal-backdrop" style="display: none;">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title">Pending Team Invitations</h3>
                <button id="btn-close-invitations-modal" class="modal-close-btn">&times;</button>
            </div>

            <div id="invitations-modal-alert" class="alert alert-error" style="display: none;"></div>

            <div id="invitations-list" style="display: flex; flex-direction: column; gap: 1rem; max-height: 380px; overflow-y: auto;">
                <div class="loading-box">Loading invitations...</div>
            </div>

            <div class="modal-footer">
                <button type="button" id="btn-done-invitations-modal" class="btn btn-secondary">Close</button>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/teams.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
