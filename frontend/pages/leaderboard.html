<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Leaderboard - Cricket App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Reusing core styles for utility classes and nav if applicable, but mostly standalone css for perfect match -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/leaderboard.css">
</head>
<body class="lb-theme">

    <!-- Top Navigation Bar -->
    <nav class="lb-nav">
        <a href="../index.html" class="lb-brand">
            <div class="lb-brand-icon">
                <svg viewBox="0 0 40 40" width="28" height="28" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <radialGradient id="lbBallShine" cx="35%" cy="30%" r="65%">
                            <stop offset="0%" stop-color="#34d399" />
                            <stop offset="35%" stop-color="#059669" />
                            <stop offset="75%" stop-color="#064e3b" />
                            <stop offset="100%" stop-color="#022c22" />
                        </radialGradient>
                    </defs>
                    <circle cx="20" cy="20" r="18" fill="url(#lbBallShine)"/>
                    <path d="M 6 12 C 14 17 26 23 34 28" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" stroke-dasharray="2,2"/>
                </svg>
            </div>
            <div class="lb-brand-text">
                <span class="lb-brand-title">CRICKET</span>
                <span class="lb-brand-subtitle">APP</span>
            </div>
        </a>

        <div class="lb-nav-links">
            <a href="../index.html">Home</a>
            <a href="matches.html">Matches</a>
            <a href="teams.html">Teams</a>
            <a href="leaderboard.html" class="active">Leaderboard</a>
            <a href="players.html">Players</a>
        </div>

        <div class="lb-nav-actions">
            <button class="lb-icon-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </button>
            <a href="profile.html" class="lb-profile-btn" id="lb-profile-btn">
                <img src="" alt="Profile" id="lb-profile-img" style="display:none;">
                <span id="lb-profile-fallback">👤</span>
            </a>
            <!-- Mobile Menu Toggle -->
            <button class="lb-mobile-toggle" id="lb-mobile-toggle">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
        </div>
    </nav>

    <!-- Mobile Drawer -->
    <div class="lb-mobile-drawer" id="lb-mobile-drawer">
        <a href="../index.html">Home</a>
        <a href="matches.html">Matches</a>
        <a href="teams.html">Teams</a>
        <a href="leaderboard.html" class="active">Leaderboard</a>
        <a href="players.html">Players</a>
    </div>

    <!-- Main Container -->
    <main class="lb-container">
        
        <header class="lb-header">
            <h1 class="lb-title">PLAYER LEADERBOARD</h1>
            <p class="lb-subtitle">The best players. The biggest performances.</p>
        </header>

        <!-- Podium Section -->
        <section class="lb-podium-section" id="lb-podium">
            <!-- Populated via JS -->
            <div class="lb-podium-placeholder">Loading Top Players...</div>
        </section>

        <!-- Category Selector -->
        <div class="lb-category-scroll">
            <div class="lb-categories" id="lb-categories">
                <button class="lb-cat-btn active" data-category="runs">🏏 Most Runs</button>
                <button class="lb-cat-btn" data-category="sixes"><span style="color:#ef4444; font-weight:900;">6</span> Most Sixes</button>
                <button class="lb-cat-btn" data-category="fours"><span style="color:#ef4444; font-weight:900;">4</span> Most Fours</button>
                <button class="lb-cat-btn" data-category="wickets">🎯 Most Wickets</button>
                <button class="lb-cat-btn" data-category="economy">⏱️ Best Economy</button>
                <button class="lb-cat-btn" data-category="strike_rate">⚡ Best Strike Rate</button>
                <button class="lb-cat-btn" data-category="maidens">🛡️ Most Maidens</button>
            </div>
        </div>

        <!-- Detailed Rankings Table Area -->
        <section class="lb-table-section">
            
            <div class="lb-table-header-row">
                <div>
                    <div class="lb-table-subheading">Detailed Rankings</div>
                    <h2 class="lb-table-heading" id="lb-table-title">Top Run Scorers</h2>
                </div>
                <div class="lb-table-actions">
                    <div class="lb-search-box">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" id="lb-search-input" placeholder="Search players...">
                    </div>
                    <button class="lb-filter-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
                        Filters
                    </button>
                </div>
            </div>

            <div class="lb-table-container">
                <table class="lb-table" id="lb-table">
                    <thead>
                        <tr id="lb-table-head-row">
                            <!-- Populated dynamically based on category -->
                        </tr>
                    </thead>
                    <tbody id="lb-table-body">
                        <!-- Populated via JS -->
                        <tr><td colspan="7" style="text-align:center; padding: 3rem;">Loading rankings...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- Footer Toolbar (Filters & Pagination matching reference) -->
            <div class="lb-footer-toolbar">
                <div class="lb-footer-filters">
                    <select class="lb-select"><option>All Time</option></select>
                    <select class="lb-select"><option>Tournament/Season</option></select>
                    <span class="lb-footer-text">Updated recently</span>
                </div>
                <div class="lb-footer-pagination">
                    <span class="lb-footer-text">Updated recently &nbsp; <span style="color:#10b981;">&#9650;</span> <span style="color:#ef4444;">&#9660;</span> </span>
                    <div class="lb-pagination-controls">
                        <button class="lb-page-btn">&laquo;</button>
                        <button class="lb-page-btn">&lsaquo;</button>
                        <button class="lb-page-btn active">1</button>
                        <button class="lb-page-btn">&rsaquo;</button>
                        <button class="lb-page-btn">&raquo;</button>
                    </div>
                </div>
            </div>

        </section>

    </main>

    <script src="../js/api.js"></script>
    <script src="../js/leaderboard.js"></script>
</body>
</html>
