<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Match - Cricket App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="dash-layout" id="create-match-container">
        <!-- Sidebar Navigation -->
        <aside class="dash-sidebar">
            <div>
                <!-- Brand Header -->
                <div class="dash-brand-header">
                    <a href="../index.html" class="dash-brand-link">
                        <div class="dash-brand-logo">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="9"></circle>
                                <path d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </div>
                        <span class="dash-brand-text">Cricket App</span>
                    </a>
                </div>

                <!-- Navigation Menu -->
                <nav class="dash-nav">
                    <a href="dashboard.html" class="dash-nav-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                        <span>Dashboard</span>
                    </a>
                    <a href="profile.html" class="dash-nav-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        <span>My Profile</span>
                    </a>
                    <a href="players.html" class="dash-nav-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <span>Search Players</span>
                    </a>
                    <a href="teams.html" class="dash-nav-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                        <span>My Teams</span>
                    </a>
                    <a href="matches.html" class="dash-nav-item active">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                        <span>Matches</span>
                    </a>
                </nav>
            </div>

            <!-- Sidebar User & Logout -->
            <div class="dash-sidebar-footer">
                <div class="dash-sidebar-user-pill">
                    <div class="dash-user-avatar">
                        <img src="" alt="User" class="user-avatar-img" style="display:none;">
                        <span class="user-avatar-fallback">👤</span>
                    </div>
                    <span class="dash-sidebar-user-name" id="sidebar-user-name">Loading...</span>
                </div>
                <button id="btn-logout" class="dash-sidebar-logout-btn">Logout</button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="dash-main" id="create-match-main">
            <!-- Header Top Bar -->
            <header class="dash-header">
                <div>
                    <a href="matches.html" style="display: inline-flex; align-items: center; gap: 0.4rem; color: #0d5c3a; font-size: 0.85rem; font-weight: 600; text-decoration: none; margin-bottom: 0.25rem;">
                        &larr; Back to My Matches
                    </a>
                    <h1 class="dash-welcome-title">Schedule New Match</h1>
                    <p class="dash-welcome-subtext">Set up a competitive cricket fixture between two teams</p>
                </div>

                <div class="dash-header-actions">
                    <a href="profile.html" class="dash-header-avatar">
                        <img src="" alt="User" class="user-avatar-img" style="display:none;">
                        <span class="user-avatar-fallback">👤</span>
                    </a>
                </div>
            </header>

            <div id="create-match-alert" class="alert alert-error" style="display: none; margin-bottom: 1.5rem;"></div>

            <!-- Create Match Form Card -->
            <div class="prof-card" style="max-width: 800px; margin: 0 auto;">
                <div class="prof-card-header">
                    <div class="prof-card-title-group">
                        <div class="prof-card-icon emerald">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4l3 3"></path></svg>
                        </div>
                        <div>
                            <h3 class="prof-card-title">Match Setup &amp; Teams</h3>
                            <p class="prof-card-subtitle">Configure teams, date, venue, and overs</p>
                        </div>
                    </div>
                </div>

                <form id="form-create-match">
                    <!-- Match Name -->
                    <div class="form-group">
                        <label for="matchName">Match Name / Title <span class="required">*</span></label>
                        <input type="text" id="matchName" required maxlength="150" class="input-field" placeholder="e.g. Sunday League Final or SRIT Challenge Trophy">
                    </div>

                    <!-- Teams Row -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="teamAId">Team A (Your Team) <span class="required">*</span></label>
                            <select id="teamAId" required class="input-field">
                                <option value="">-- Loading Your Teams... --</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="teamBId">Team B (Opponent Team) <span class="required">*</span></label>
                            <select id="teamBId" required class="input-field">
                                <option value="">-- Loading Opponent Teams... --</option>
                            </select>
                        </div>
                    </div>

                    <!-- Date & Time Row -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="matchDate">Match Date <span class="required">*</span></label>
                            <input type="date" id="matchDate" required class="input-field">
                        </div>

                        <div class="form-group">
                            <label for="matchTime">Match Time <span class="required">*</span></label>
                            <input type="time" id="matchTime" required class="input-field">
                        </div>
                    </div>

                    <!-- Venue -->
                    <div class="form-group">
                        <label for="venue">Match Venue / Ground <span class="required">*</span></label>
                        <input type="text" id="venue" required maxlength="150" class="input-field" placeholder="e.g. SRIT Sports Ground, Nellore">
                    </div>

                    <!-- Format & Overs Row -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="format">Match Format <span class="required">*</span></label>
                            <select id="format" required class="input-field">
                                <option value="T20">T20 (20 Overs)</option>
                                <option value="T10">T10 (10 Overs)</option>
                                <option value="ODI">ODI (50 Overs)</option>
                                <option value="CUSTOM">Custom Overs</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="overs">Overs Per Innings <span class="required">*</span></label>
                            <input type="number" id="overs" value="20" min="1" max="100" class="input-field" readonly>
                        </div>
                    </div>

                    <!-- Description -->
                    <div class="form-group">
                        <label for="description">Match Description / Notes (Optional)</label>
                        <textarea id="description" rows="3" maxlength="500" class="input-field" placeholder="Add tournament info, dress code, match rules, or notes..."></textarea>
                    </div>

                    <!-- Submit Buttons -->
                    <div style="display: flex; gap: 1rem; margin-top: 1.5rem; justify-content: flex-end;">
                        <a href="matches.html" class="btn btn-secondary">Cancel</a>
                        <button type="submit" id="btn-submit-match" class="btn btn-primary">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
                            <span>Schedule Match</span>
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/create-match.js"></script>
</body>
</html>
