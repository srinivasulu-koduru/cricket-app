<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Players - Cricket App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="dash-layout" id="players-page-container">
        <!-- Sidebar Navigation -->
        <aside class="dash-sidebar">
            <div>
                <!-- Brand Header -->
                <div class="dash-brand-header">
                    <a href="../index.html" class="dash-brand-link">
                        <div class="dash-brand-logo">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="9"></circle>
                                <path d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </div>
                        <span class="dash-brand-text">Cricket App</span>
                    </a>
                </div>

                <!-- Navigation Menu -->
                <nav class="dash-nav">
                    <a href="dashboard.html" class="dash-nav-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                        <span>Dashboard</span>
                    </a>
                    <a href="profile.html" class="dash-nav-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        <span>My Profile</span>
                    </a>
                    <a href="players.html" class="dash-nav-item active">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <span>Search Players</span>
                    </a>
                    <a href="teams.html" class="dash-nav-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                        <span>My Teams</span>
                    </a>
                    <a href="teams.html" class="dash-nav-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="17" y1="11" x2="23" y2="11"></line></svg>
                        <span>Invitations</span>
                    </a>
                </nav>
            </div>

            <!-- Sidebar User & Logout -->
            <div class="dash-sidebar-footer">
                <div class="dash-sidebar-user-pill">
                    <div class="dash-user-avatar">
                        <img src="" alt="User" class="user-avatar-img" style="display:none;">
                        <span class="user-avatar-fallback">👤</span>
                    </div>
                    <span class="dash-sidebar-user-name" id="sidebar-user-name">Loading...</span>
                </div>
                <button id="btn-logout" class="dash-sidebar-logout-btn">Logout</button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="dash-main" id="players-main-content">
            <!-- Header Top Bar -->
            <header class="dash-header">
                <div>
                    <h1 class="dash-welcome-title">Find Players</h1>
                    <p class="dash-welcome-subtext">Search players by name or CRK ID</p>
                </div>

                <div class="dash-header-actions">
                    <button class="dash-icon-btn" aria-label="Notifications" id="btn-notifications-placeholder">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                    </button>

                    <a href="profile.html" class="dash-header-avatar">
                        <img src="" alt="User" class="user-avatar-img" style="display:none;">
                        <span class="user-avatar-fallback">👤</span>
                    </a>
                </div>
            </header>

            <div id="players-alert" class="alert alert-error" style="display: none; margin-bottom: 1.5rem;"></div>

            <!-- Search Bar Card -->
            <section class="search-bar-card">
                <div class="search-input-wrapper">
                    <div class="search-input-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    </div>
                    <input type="text" id="player-search-input" class="search-input-field" placeholder="Search by player name or CRK ID (e.g. Srinivasulu, CRK102847)..." autocomplete="off">
                    <button type="button" id="btn-clear-search" class="search-clear-btn" style="display: none;" title="Clear search">&times;</button>
                    <button type="button" id="btn-do-search" class="search-submit-btn">Search</button>
                </div>
            </section>

            <!-- Search Results Container -->
            <section style="margin-top: 1.75rem;">
                <div class="dash-section-header" style="margin-bottom: 1.25rem;">
                    <h3 class="dash-section-title" id="results-count-title">Player Search Results</h3>
                </div>

                <div id="players-results-grid" class="players-cards-grid">
                    <!-- Default Initial State -->
                    <div class="search-state-box">
                        <div class="state-icon-circle emerald">
                            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                        </div>
                        <h3 class="state-title">Find your next teammate</h3>
                        <p class="state-subtext">Search using a player name or CRK ID (e.g. Srinivasulu, CRK102847).</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/players.js"></script>
</body>
</html>
